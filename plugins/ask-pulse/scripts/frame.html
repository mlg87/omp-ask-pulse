<!doctype html>
<meta charset="utf-8" />
<title>ask-pulse preview frame</title>
<style>
  html, body { margin: 0; background: #0b0b0f; }
  #term {
    font: 15px/1.45 Menlo, "DejaVu Sans Mono", monospace;
    padding: 18px 20px;
    white-space: pre;
    color: #c9c9d4;
    width: max-content;
  }
  .dim { color: #6c6c7a; }
  .accent { color: #7fd1ff; }
</style>
<div id="term"></div>
<script>
  // Mirrors the render math in ../src/ask-pulse.ts. Keep COLOR_A/COLOR_B/PULSE_PERIOD_MS/TITLE in
  // sync with the extension so the published preview never drifts from the real banner.
  const COLOR_B = [0x0a, 0xf0, 0xff];
  const COLOR_A = [0xff, 0x10, 0xf0];
  const PULSE_PERIOD_MS = 1200;
  const TITLE = " WAITING FOR YOUR INPUT ";
  const WIDTH = 76;
  const G = { topLeft: "\u256d", topRight: "\u256e", bottomLeft: "\u2570", bottomRight: "\u256f", horizontal: "\u2500", vertical: "\u2502" };
  const QUESTIONS = ["[Deploy] Apply the pending migration to production?"];

  const mix = (t) => COLOR_B.map((c, i) => Math.round(c + (COLOR_A[i] - c) * t));
  const css = (t) => `rgb(${mix(t).join(",")})`;
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const span = (s, t) => `<span style="color:${css(t)}">${esc(s)}</span>`;

  function bannerLines(t) {
    const inner = WIDTH - 4;
    const rule = WIDTH - 2;
    const left = Math.floor((rule - TITLE.length) / 2);
    const right = rule - TITLE.length - left;
    const bar = span(G.vertical, t);
    const out = [span(G.topLeft + G.horizontal.repeat(left) + TITLE + G.horizontal.repeat(right) + G.topRight, t)];
    for (const q of QUESTIONS) {
      const pad = " ".repeat(Math.max(0, inner - q.length));
      out.push(`${bar} ${span(q, Math.max(0.5, t))}${pad} ${bar}`);
    }
    out.push(span(G.bottomLeft + G.horizontal.repeat(rule) + G.bottomRight, t));
    return out;
  }

  // Static stand-in for the real ask dialog, which mounts directly below the banner.
  const bar = `<span class="dim">${G.vertical}</span>`;
  const row = (plain, html) => `${bar}${html}${" ".repeat(Math.max(0, WIDTH - 2 - plain.length))}${bar}`;
  const dialog = [
    `<span class="dim">${G.topLeft}${G.horizontal.repeat(WIDTH - 2)}${G.topRight}</span>`,
    row(" Apply the pending migration to production?", ` <span class="accent">Apply the pending migration to production?</span>`),
    row("", ""),
    row("   \u276f Apply now (Recommended)", `   <span style="color:#ff10f0">\u276f</span> Apply now (Recommended)`),
    row("     Dry run first", `     <span class="dim">Dry run first</span>`),
    row("     Cancel", `     <span class="dim">Cancel</span>`),
    row("     Other (type your own)", `     <span class="dim">Other (type your own)</span>`),
    `<span class="dim">${G.bottomLeft}${G.horizontal.repeat(WIDTH - 2)}${G.bottomRight}</span>`,
  ];

  window.setPhase = (ms) => {
    const t = (1 + Math.sin((ms / PULSE_PERIOD_MS) * 2 * Math.PI)) / 2;
    document.getElementById("term").innerHTML = [...bannerLines(t), ...dialog].join("\n");
  };

  // Headless Chrome/Edge screenshots one URL per frame: ?t=<elapsed ms>.
  window.setPhase(Number(new URLSearchParams(location.search).get("t") ?? 0));
</script>
